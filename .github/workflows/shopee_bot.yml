name: Shopee MY Telegram

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
    - cron: '45 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 手动和定时运行共用一把锁，避免同时预留同一商品。
concurrency:
  group: shopee-my-telegram
  cancel-in-progress: false

jobs:
  post:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: 安装依赖并配置提交身份
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > "$RUNNER_TEMP/save-state" <<'SH'
          set -eu
          git add -- posted_items.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$1" -- posted_items.json
          for delay in 1 2 4; do
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            sleep "$delay"
            git pull --rebase origin "$BRANCH"
          done
          git push origin "HEAD:refs/heads/$BRANCH"
          SH

      - name: 选品、转链、准备图文
        id: pick
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COPY_LANG: ${{ vars.COPY_LANG }}
          MIN_SALES: ${{ vars.MIN_SALES }}
          MIN_SELLER_RATE: ${{ vars.MIN_SELLER_RATE }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: python main.py prepare

      - name: 先把防重预留写回默认分支
        if: steps.pick.outputs.ready == 'true'
        run: bash "$RUNNER_TEMP/save-state" "Reserve Shopee item"

      - name: 发送 Telegram 主图与说明
        id: delivery
        if: steps.pick.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py send

      - name: 提交回执或释放明确拒收的预留
        if: always() && (steps.delivery.outcome == 'success' || steps.delivery.outcome == 'failure')
        run: bash "$RUNNER_TEMP/save-state" "Record Shopee delivery outcome"
